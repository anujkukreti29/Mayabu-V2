services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3000}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
