name: Mayabu CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mayabu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q mayabu mayabu_db mayabu_refresh
      - name: Ruff
        run: ruff check mayabu mayabu_db mayabu_refresh tests
      - name: Migration module import
        env:
          PYTHONPATH: .
        run: python -c "from mayabu_db.migrate import list_migration_files, status; print(len(list_migration_files()))"
      - name: Backend tests
        env:
          PYTHONPATH: .
        run: pytest -q -m "not integration"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm run test
      - name: Production SSR build
        run: npm run build
      - name: Prerender verification
        run: node scripts/verify-prerender.mjs
      - name: SEO verification
        run: node scripts/verify-seo.mjs

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Deterministic E2E tests
        run: npm run test:e2e
