# Example reverse proxy (Nginx) — adapt hostnames; do not commit live certs.

# Prefer one public origin: frontend + /api → FastAPI.
# Terminate TLS at the edge. Set X-Forwarded-Proto. Strip client spoofed forwards.

upstream mayabu_api {
  server 127.0.0.1:8000;
  keepalive 32;
}

upstream mayabu_frontend {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name mayabu.example www.mayabu.example;
  return 301 https://mayabu.example$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.mayabu.example;
  # ssl_certificate ...;
  # ssl_certificate_key ...;
  return 301 https://mayabu.example$request_uri;
}

server {
  listen 443 ssl http2;
  server_name mayabu.example;
  # ssl_certificate ...;
  # ssl_certificate_key ...;

  # Fingerprinted assets — long cache (adjust to your build output paths)
  location /assets/ {
    proxy_pass http://mayabu_frontend;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://mayabu_api;
    # Do not cache authenticated API at the edge.
    add_header Cache-Control "private, no-store";
  }

  # Protect metrics at the edge as defense-in-depth (app also requires admin token).
  location = /api/metrics {
    allow 10.0.0.0/8;
    deny all;
    proxy_pass http://mayabu_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Mayabu-Admin-Token $http_x_mayabu_admin_token;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass http://mayabu_frontend;
    # SSR may include auth hydration — never shared-cache HTML.
    add_header Cache-Control "private, no-store";
  }
}
